# The Collection's Toolbox tab: the tools Jack uses, in groups by what they're for (how to add one: README.md here).
# Groups show in this order, and the tools in each group in the order listed.
# where: windows, terminal, chrome or website (it sets the colour of the tool's letter).
# command: only for a terminal tool, shown with a Copy button.

groups:
  - name: Find files
    tools:
      - name: Everything
        where: windows
        link: https://www.voidtools.com/
        note: instant file search
        star: true

  - name: Clean up the PC
    tools:
      - name: Geek Uninstaller
        where: windows
        link: https://geekuninstaller.com/
        note: remove apps and their leftovers
      - name: Bulk Crap Uninstaller
        where: windows
        link: https://www.bcuninstaller.com/
        note: 最强的卸载神器！免费开源
        star: true
      - name: SpaceSniffer
        where: windows
        link: https://www.uderzo.it/main_products/space_sniffer/
        note: see what fills a disk, as a map
      - name: TreeSize Free
        where: windows
        link: https://www.jam-software.com/treesize_free
        note: 磁盘空间分析器
        star: true
      - name: Windows Memory Cleaner
        where: windows
        link: https://github.com/IgorMundstein/WinMemoryCleaner
        note: free up memory
        star: true

  - name: Handy on Windows
    tools:
      - name: PowerToys
        where: windows
        link: https://learn.microsoft.com/en-us/windows/powertoys/
        note: Check rgb color, and more
      - name: Ninite
        where: website
        link: https://ninite.com/
        note: Common useful apps customized package

  - name: Video & music
    tools:
      - name: yoinks
        where: terminal
        link: https://github.com/pablostanley/yoinks
        note: download a video from almost any site
        command: npx yoinks
      - name: HandBrake
        where: windows
        link: https://handbrake.fr/
        note: convert videos
      - name: Ultimate Vocal Remover
        where: windows
        link: https://github.com/Anjok07/ultimatevocalremovergui
        note: separate vocals from music, offline

  - name: Pictures
    tools:
      - name: Background Remover
        where: website
        link: https://magicstudio.com/background-remover/
        note: 图片在线去背
      - name: GoFullPage
        where: chrome
        link: https://chromewebstore.google.com/detail/fdpohaocaechififmbbbbbknoalclacl
        note: 长截图插件
      - name: ImageAssistant
        where: chrome
        link: https://chromewebstore.google.com/detail/dbjbempljhcmhlfpfacalomonjpalpko
        note: Batch image downloader (any websites)
      - name: Umi-OCR
        where: windows
        link: https://github.com/hiroi-sora/Umi-OCR
        note: 支持离线使用的OCR图片识字软件

  - name: PDFs & files
    tools:
      - name: PDFgear
        where: windows
        link: https://www.pdfgear.com/
        note: Editable PDF
      - name: TinyWow
        where: website
        link: https://tinywow.com/
        note: Files Converter
      - name: PDF Pages
        where: website
        link: https://jacklee981229.github.io/lab/pdf-pages/
        note: Merge, split, turn and reorder the pages of PDFs

  - name: In the browser
    tools:
      - name: Extension Manager
        where: chrome
        link: https://chromewebstore.google.com/detail/gjldcdngmdknpinoemndlidpcabkggco
        note: 插件优化管理
      - name: Toggle JavaScript
        where: chrome
        link: https://chromewebstore.google.com/detail/cidlcjdalomndpeagkjpnefhljffbnlo
        note: 禁用网页JS脚本 破右键锁

  - name: Build & host
    tools:
      - name: OpenCode
        where: terminal
        link: https://opencode.ai/
        note: open-source AI coding agent, any model
        command: npm i -g opencode-ai
      - name: Claude SEO
        where: terminal
        link: https://github.com/AgriciDaniel/claude-seo
        note: SEO check-up inside Claude Code
        command: claude plugin marketplace add AgriciDaniel/claude-seo
      - name: Coolify
        where: website
        link: https://coolify.io/
        note: host your own apps, like Vercel

  - name: Learn & get things done
    tools:
      - name: roadmap.sh
        where: website
        link: https://roadmap.sh/roadmaps
        note: 學習！
      - name: Typing Speed Test
        where: website
        link: https://typing-speed-test.aoeu.eu/
        note: how fast can you type
      - name: MuscleWiki
        where: website
        link: https://musclewiki.com/
        note: pick a muscle, see the exercises

  - name: Just for fun
    tools:
      - name: ToonMe
        where: website
        link: https://toonme.com/
        note: 人脸卡通形象生成器
      - name: Cyberthreat Real-Time Map
        where: website
        link: https://cybermap.kaspersky.com/
        note: 全球网络攻击
