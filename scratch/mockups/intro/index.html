<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome screen preview · Jack's Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap">
<style>
  /* The site's colours (src/styles/tokens.css), so each intro looks as it would on the site. */
  :root {
    --paper: #F5F6F8; --surface: #FFFFFF; --ink: #172030; --muted: #536073; --rule: #D5DBE3; --focus: #1B5FD1;
    --hexo: #0A7780; --chatgpt: #7143B5; --flutter: #1C60C8;
    --font: 'Schibsted Grotesk', system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --paper: #0E141D; --surface: #151D29; --ink: #E3E8EF; --muted: #99A4B5; --rule: #253041; --focus: #7DB0FF;
    --hexo: #47C2CB; --chatgpt: #BA9CF5; --flutter: #7AAAFF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  .backdrop { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; }

  /* The panel hides while an intro plays, so you see what a visitor would. */
  .panel { position: fixed; left: 20px; bottom: 20px; z-index: 5; width: min(340px, calc(100vw - 40px)); padding: 18px; border: 1px solid var(--rule); border-radius: 18px; background: var(--surface); box-shadow: 0 18px 50px rgb(0 0 0 / 0.28); transition: opacity 0.3s ease, transform 0.3s ease; }
  .playing .panel { opacity: 0; transform: translateY(10px); pointer-events: none; }
  .panel h1 { margin: 0 0 4px; font-size: 1rem; font-weight: 750; }
  .panel p { margin: 0; color: var(--muted); font-size: 0.8125rem; line-height: 1.45; }
  .choices { display: grid; gap: 8px; margin: 14px 0; }
  .choice { display: grid; gap: 2px; width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 12px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .choice b { font-size: 0.9375rem; }
  .choice span { color: var(--muted); font-size: 0.8125rem; line-height: 1.4; }
  .choice:hover, .row button:hover { border-color: var(--ink); }
  .choice[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row button { flex: 1; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 999px; background: transparent; color: var(--ink); font: 600 0.8125rem var(--font); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  kbd { padding: 0 5px; border: 1px solid var(--rule); border-radius: 5px; font: 600 0.75rem var(--font); }

  /* Shared by all three: a full-screen layer over the page, the words centred. */
  .intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--paper); }
  .stage { display: grid; justify-items: center; text-align: center; }
  .kicker { margin: 0 0 0.35em; color: var(--muted); font-size: clamp(1.1rem, 2.2vw, 1.6rem); font-weight: 500; letter-spacing: -0.01em; }
  .name { margin: 0; font-size: clamp(3.4rem, 11vw, 9rem); font-weight: 800; line-height: 0.95; letter-spacing: -0.045em; }

  /* A. Reveal: rise out of a blur, a sheen of the topic colours, then zoom through into the page. */
  .intro-a { animation: a-out 0.7s 2.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  .intro-a .stage { animation: a-zoom 0.7s 2.3s cubic-bezier(0.5, 0, 0.75, 0) forwards; }
  .intro-a .kicker { animation: a-rise 0.8s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .intro-a .name {
    padding: 0.04em 0.08em 0.2em; margin-bottom: -0.16em;
    background: linear-gradient(110deg, var(--ink) 0 38%, var(--hexo) 45%, var(--flutter) 50%, var(--chatgpt) 55%, var(--ink) 62% 100%) 100% 0 / 260% 100% no-repeat;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: a-rise 1s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both, a-sheen 1.3s 1s cubic-bezier(0.45, 0, 0.25, 1) both;
  }
  @keyframes a-rise { from { opacity: 0; transform: translateY(0.35em) scale(0.97); filter: blur(16px); } }
  @keyframes a-sheen { to { background-position: 0% 0; } }
  @keyframes a-zoom { to { transform: scale(1.14); filter: blur(10px); } }
  @keyframes a-out { to { opacity: 0; visibility: hidden; } }

  /* B. Curtain: words slide up from behind a line, a bar fills, then the whole screen lifts away. */
  .intro-b { box-shadow: 0 40px 80px rgb(0 0 0 / 0.25); animation: b-lift 0.8s 2.2s cubic-bezier(0.76, 0, 0.24, 1) forwards; }
  .intro-b .stage { animation: b-stage 0.6s 2.2s cubic-bezier(0.76, 0, 0.24, 1) forwards; }
  .intro-b .line { display: block; overflow: hidden; padding: 0.04em 0.08em 0.18em; margin-bottom: -0.14em; }
  .intro-b .word { display: inline-block; animation: b-up 1s var(--d) cubic-bezier(0.16, 1, 0.3, 1) both; }
  .intro-b .bar { position: relative; width: clamp(120px, 16vw, 220px); height: 3px; margin-top: 34px; overflow: hidden; border-radius: 3px; background: var(--rule); }
  .intro-b .bar::after { content: ''; position: absolute; inset: 0; background: var(--ink); transform-origin: left; animation: b-fill 1.7s 0.5s cubic-bezier(0.65, 0, 0.35, 1) both; }
  @keyframes b-up { from { transform: translateY(110%); } }
  @keyframes b-fill { from { transform: scaleX(0); } }
  @keyframes b-stage { to { transform: translateY(-8vh); opacity: 0; } }
  @keyframes b-lift { to { transform: translateY(-100%); visibility: hidden; } }

  /* C. Spotlight: a dark stage; a light finds the name, floods it, then everything fades into the page. */
  @property --x { syntax: '<percentage>'; inherits: true; initial-value: -30%; }
  @property --r { syntax: '<length>'; inherits: true; initial-value: 0px; }
  .intro-c { background: #050608; animation: c-out 0.7s 2.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  .intro-c .stage { animation: c-sweep 1.5s 0.3s cubic-bezier(0.45, 0, 0.25, 1) both, c-back 0.7s 2.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  .intro-c .kicker { color: #8A93A3; animation: c-fade 1s 0.2s ease both; }
  .intro-c .name { position: relative; --r: 1.1em; color: #1A1F28; animation: c-open 0.7s 1.8s cubic-bezier(0.3, 0, 0.2, 1) forwards; }
  /* The glow's box is three names wide and four tall, so the light never meets an edge; the name is its middle third. */
  .intro-c .name::before { content: ''; position: absolute; inset: -150% -100%; z-index: -1; background: radial-gradient(circle 1.6em at calc(33.333% + var(--x) / 3) 50%, rgb(122 170 255 / 0.2), transparent 100%); }
  .intro-c .name::after {
    content: attr(data-text); position: absolute; inset: 0;
    background: linear-gradient(90deg, #FFFFFF 0%, #D5E4FF 35%, #E6DCFF 65%, #FFFFFF 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) 55%, #000 35%, transparent 100%);
    mask-image: radial-gradient(circle var(--r) at var(--x) 55%, #000 35%, transparent 100%);
  }
  @keyframes c-sweep { to { --x: 50%; } }
  @keyframes c-open { to { --r: 9em; } }
  @keyframes c-fade { from { opacity: 0; filter: blur(8px); } }
  @keyframes c-back { to { transform: scale(0.97); } }
  @keyframes c-out { to { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>
<img class="backdrop" src="home-dark.jpg" alt="">

<aside class="panel" aria-label="Preview controls">
  <h1>Welcome screen: pick a style</h1>
  <p>Each lasts 3 seconds, then lifts to show the home page.</p>
  <div class="choices">
    <button type="button" class="choice" data-style="a" aria-pressed="true"><b>A. Reveal</b><span>Rises out of a blur, a sheen of the topic colours runs through the name, then it zooms towards you.</span></button>
    <button type="button" class="choice" data-style="b" aria-pressed="false"><b>B. Curtain</b><span>Words slide up from behind a line, a thin bar fills, then the screen lifts like a curtain.</span></button>
    <button type="button" class="choice" data-style="c" aria-pressed="false"><b>C. Spotlight</b><span>A dark stage where a moving light finds the name, then fades into the page.</span></button>
  </div>
  <div class="row"><button type="button" id="replay">Replay</button><button type="button" id="theme">Light backdrop</button></div>
  <p>Keys: <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> play a style, <kbd>R</kbd> replays. Click or press any key during an intro to skip it, as on the site. On the site, the big title then types itself (not shown here).</p>
</aside>

<script>
  const TEMPLATES = {
    a: `<div class="stage"><p class="kicker">Welcome to</p><p class="name">Jack's Space</p></div>`,
    b: `<div class="stage"><p class="kicker line"><span class="word" style="--d: 0.1s">Welcome</span> <span class="word" style="--d: 0.18s">to</span></p>`
      + `<p class="name line"><span class="word" style="--d: 0.38s">Jack's</span> <span class="word" style="--d: 0.5s">Space</span></p><div class="bar"></div></div>`,
    c: `<div class="stage"><p class="kicker">Welcome to</p><p class="name" data-text="Jack's Space">Jack's Space</p></div>`,
  };
  // The animation on the layer itself that ends each intro.
  const LAST = { a: 'a-out', b: 'b-lift', c: 'c-out' };
  let current = null;
  let chosen = 'a';

  function finish(el) {
    el.remove();
    if (current === el) {
      current = null;
      document.body.classList.remove('playing');
    }
  }

  function play(style) {
    if (current) finish(current);
    chosen = style;
    document.querySelectorAll('.choice').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.style === style)));
    const el = document.createElement('div');
    el.className = `intro intro-${style}`;
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = TEMPLATES[style];
    el.addEventListener('animationend', (e) => { if (e.target === el && e.animationName === LAST[style]) finish(el); });
    document.body.append(el);
    document.body.classList.add('playing');
    current = el;
  }

  // Skipping fades out whatever is on screen, the way the site will.
  function skip() {
    const el = current;
    if (!el || el.dataset.skipping) return;
    el.dataset.skipping = 'true';
    el.animate([{ opacity: getComputedStyle(el).opacity }, { opacity: 0 }], { duration: 350, easing: 'ease', fill: 'forwards' }).finished.then(() => finish(el));
  }

  document.addEventListener('pointerdown', (e) => {
    if (!current) return;
    e.preventDefault();
    skip();
  });
  document.addEventListener('keydown', (e) => {
    if (current) return skip();
    if (['1', '2', '3'].includes(e.key)) play('abc'[Number(e.key) - 1]);
    if (e.key === 'r' || e.key === 'R') play(chosen);
  });
  document.querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => play(b.dataset.style)));
  document.getElementById('replay').addEventListener('click', () => play(chosen));
  document.getElementById('theme').addEventListener('click', (e) => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    document.querySelector('.backdrop').src = `home-${next}.jpg`;
    e.currentTarget.textContent = next === 'dark' ? 'Light backdrop' : 'Dark backdrop';
  });
  document.fonts.ready.then(() => setTimeout(() => play('a'), 400));
</script>
</body>
</html>
