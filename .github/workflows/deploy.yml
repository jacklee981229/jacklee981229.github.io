# Builds the site and publishes it to GitHub Pages on every push to main, and once a day.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The Lab's Most Popular is ranked while the site is built, so a daily build keeps it fresh (04:17 in Malaysia).
  # GitHub pauses this timer after 60 days without a push; the next push starts it again.
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a deploy halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # The whole history, so Now's date (the last commit that changed src/content/now.md) is the real one: in a
        # shallow clone every file looks changed in the newest commit.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # The same Node as Jack's PC (D1 in docs/PLAN.md), so the site builds the same way here.
          node-version: 20.18.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
